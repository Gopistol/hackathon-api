<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 인터뷰 데모</title>
<style>
  :root { --bg: #fffaf3; --fg: #222; --muted: #6b6257; --accent: #d9480f; --card: #fff; --line: #eadfce; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #1d1a17; --fg: #f3ede6; --muted: #b3a89b; --accent: #ff8a4c; --card: #29241f; --line: #3d352d; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 18px/1.5 system-ui, "Malgun Gothic", sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 22px; margin: 8px 0 16px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  select, input, button { font: inherit; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--fg); }
  button.primary { background: var(--accent); color: #fff; border: 0; font-weight: 700; }
  #status { font-size: 22px; font-weight: 700; text-align: center; margin: 18px 0 6px; min-height: 33px; }
  #meter { height: 10px; border-radius: 5px; background: var(--line); overflow: hidden; }
  #meter div { height: 100%; width: 0; background: var(--accent); transition: width .08s; }
  #log { margin-top: 16px; display: flex; flex-direction: column; gap: 8px; }
  .ai, .me { padding: 10px 14px; border-radius: 14px; max-width: 88%; }
  .ai { background: var(--card); border: 1px solid var(--line); }
  .me { background: var(--accent); color: #fff; align-self: flex-end; }
  .me.live { opacity: .75; }
  .me.live::after { content: " ▍"; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  pre { white-space: pre-wrap; background: var(--card); border: 1px solid var(--line); padding: 12px; border-radius: 10px; font-size: 14px; }
  .hidden { display: none; }
</style>
</head>
<body>
<main>
  <h1>AI 인터뷰 (통화형)</h1>
  <div class="row">
    <select id="kind"><option value="register">가게 등록</option><option value="story">이야기 (숏폼)</option></select>
    <input id="store" type="number" placeholder="가게 번호 (이야기)" style="width:170px">
    <button id="start" class="primary">통화 시작</button>
    <button id="stop">그만하기</button>
  </div>
  <div id="status">통화 시작을 눌러 주세요</div>
  <div id="meter"><div></div></div>
  <div class="row" style="margin-top:12px">
    <input id="text" placeholder="말 대신 글로 답하기" style="flex:1">
    <button id="send">보내기</button>
  </div>
  <div id="log"></div>
  <div id="result" class="hidden">
    <h2>결과</h2>
    <pre id="resultText"></pre>
    <div class="row" id="publishRow"><button id="publish" class="primary">가게 올리기</button></div>
    <div class="row" id="videoRow"><input id="photos" type="file" accept="image/*" multiple><button id="video" class="primary">영상 만들기</button></div>
    <div id="videoOut"></div>
  </div>
</main>
<script>
const API = "/api/v1/merchant";
const $ = (id) => document.getElementById(id);
const player = new Audio();
let ctx, analyser, stream, iv = null, turn = 0, busy = false, stopped = true;
let fillers = [], fillerIdx = 0;

// 말이 멈췄다고 보는 시간, 아무 말 없을 때 기다리는 시간, 한 번 답의 최대 길이.
// 실시간 받아쓰기로 문장이 끝난 것("~요", "~다")이 보이면 0.8초, 말이 이어질 것 같으면("그래서", "~고") 1.8초 기다린다.
const END_SILENCE_MS = 800, MID_SENTENCE_MS = 1800, NO_CAPTION_MS = 1100, NO_SPEECH_MS = 12000, MAX_ANSWER_MS = 30000;
const DONE_RE = /(요|다|죠|까|네|음|어|야|지|래|해|돼|원)[.?!~]*\s*$/;
const MORE_RE = /((그래서|그러니까|그리고|그게|근데|그런데|는데|해서|면서|니까|지만|하고|은|는|을|를|에|도|랑|고)|(^|\s)(저기|어+|음+|그))[,.~]*\s*$/;

// 실시간 받아쓰기 (Chrome·Edge·Safari). 화면에 바로 보여 주고 서버 음성 인식이 실패했을 때 대신 보낸다.
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

function say(cls, text) { const d = document.createElement("div"); d.className = cls; d.textContent = text; $("log").append(d); d.scrollIntoView({ block: "end" }); return d; }

// changed: 마지막으로 글자가 바뀐 시각. broken: 받아쓰기가 안 되면 true (그때는 소리 크기로만 판단)
function captions(onText) {
  if (!SR) return null;
  try {
    const r = new SR(); r.lang = "ko-KR"; r.continuous = true; r.interimResults = true;
    let final = "";
    const cap = { changed: 0, broken: false, stop: () => { try { r.stop(); } catch (e) {} } };
    r.onresult = (e) => {
      let interim = "";
      for (let i = e.resultIndex; i < e.results.length; i++) {
        if (e.results[i].isFinal) final += e.results[i][0].transcript; else interim += e.results[i][0].transcript;
      }
      cap.changed = performance.now();
      onText((final + interim).trim());
    };
    r.onerror = (e) => { if (e.error !== "no-speech" && e.error !== "aborted") cap.broken = true; };
    r.start();
    return cap;
  } catch (e) { return null; }
}
function status(t) { $("status").textContent = t; }

async function speak(text, url, label = "🔊 AI가 말하는 중") {
  status(label);
  if (url) {
    try { player.src = url; await player.play(); await new Promise((r) => (player.onended = r)); return; } catch (e) {}
  }
  // 음성 주소가 없으면(mock) 브라우저 음성으로
  await new Promise((resolve) => {
    if (!("speechSynthesis" in window)) return resolve();
    const u = new SpeechSynthesisUtterance(text); u.lang = "ko-KR"; u.rate = 0.95; u.onend = resolve; u.onerror = resolve;
    speechSynthesis.speak(u);
  });
}

// 맞장구("네~")는 시작할 때 미리 받아 두고, 말이 끝나자마자 틀어 다음 질문을 기다리는 동안을 메운다
async function loadFillers(list) {
  fillers = await Promise.all((list || []).map(async (f) => {
    try { return f.audio_url ? { text: f.text, url: URL.createObjectURL(await (await fetch(f.audio_url)).blob()) } : { text: f.text }; }
    catch (e) { return { text: f.text }; }
  }));
}

function backchannel() {
  if (!fillers.length) return Promise.resolve();
  const f = fillers[fillerIdx++ % fillers.length];
  return speak(f.text, f.url, "💭 생각하는 중…");
}

// iOS 는 탭 안에서 한 번 재생한 audio 요소만 나중에 자동 재생된다. 0.1초 무음 wav 로 열어 둔다.
function silentWav() {
  const n = 800, b = new ArrayBuffer(44 + n * 2), v = new DataView(b);
  const w = (o, t) => [...t].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
  w(0, "RIFF"); v.setUint32(4, 36 + n * 2, true); w(8, "WAVE"); w(12, "fmt "); v.setUint32(16, 16, true);
  v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, 8000, true); v.setUint32(28, 16000, true);
  v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, "data"); v.setUint32(40, n * 2, true);
  return URL.createObjectURL(new Blob([b], { type: "audio/wav" }));
}

function level() {
  const buf = new Float32Array(analyser.fftSize); analyser.getFloatTimeDomainData(buf);
  return Math.sqrt(buf.reduce((s, x) => s + x * x, 0) / buf.length);
}

// 듣기: 말이 시작되고 조용해지면 끝 → { blob, text }. 아무 말이 없으면 null
// 말하는 동안 받아쓴 글을 말풍선에 바로 보여 준다 (서버 인식 결과가 오면 그걸로 바꾼다).
// 잡음 대책: ① 목소리 대역(300~3400Hz)만 본다 ② 소음 크기를 최근 1.5초로 계속 다시 잰다
// ③ 받아쓰기가 되면 "글자가 나와야 말한 것", "글자가 멈추면 말이 끝난 것"으로 본다 (선풍기·시장 소리로 안 끝나는 문제)
function listen() {
  return new Promise((resolve) => {
    status("🎙️ 듣고 있어요. 편하게 말씀하세요");
    const rec = new MediaRecorder(stream), chunks = [];
    rec.ondataavailable = (e) => chunks.push(e.data);
    const t0 = performance.now();
    let spoke = false, loudSince = 0, lastLoud = 0, live = "", bubble = null;
    const recent = [];  // 최근 1.5초 소리 크기
    const cap = captions((t) => {
      live = t;
      if (!t) return;
      bubble = bubble || say("me live", "");
      bubble.textContent = t; bubble.scrollIntoView({ block: "end" });
    });
    const silenceNeeded = () => !cap ? NO_CAPTION_MS : MORE_RE.test(live) ? MID_SENTENCE_MS : DONE_RE.test(live) ? END_SILENCE_MS : NO_CAPTION_MS;
    rec.onstop = () => {
      if (cap) cap.stop();
      if (!spoke) { if (bubble) bubble.remove(); return resolve(null); }
      resolve({ blob: new Blob(chunks, { type: rec.mimeType }), text: live, bubble });
    };
    rec.start();
    (function tick() {
      if (rec.state !== "recording") return;
      const now = performance.now(), v = level();
      recent.push(v); if (recent.length > 90) recent.shift();
      // 말 사이사이 조용한 순간의 크기 = 지금 소음 크기 (하위 20%)
      const floor = [...recent].sort((a, b) => a - b)[Math.floor(recent.length * 0.2)] || 0;
      const threshold = Math.max(0.012, floor * 2.5 + 0.004);
      $("meter").firstChild.style.width = Math.min(100, (v / threshold) * 50) + "%";
      const loud = v > threshold;
      if (loud) { loudSince = loudSince || now; lastLoud = now; } else loudSince = 0;
      const useCaptions = cap && !cap.broken;
      if (useCaptions) spoke = spoke || !!live;  // 글자가 나와야 말한 것으로 본다
      else if (loudSince && now - loudSince > 250) spoke = true;
      const quiet = useCaptions
        ? now - Math.max(cap.changed, t0) > silenceNeeded() + 300 && (now - lastLoud > silenceNeeded() || now - cap.changed > 2500)
        : now - lastLoud > silenceNeeded();
      if (stopped || (spoke && quiet) || (!spoke && now - t0 > NO_SPEECH_MS) || now - t0 > MAX_ANSWER_MS) rec.stop();
      else requestAnimationFrame(tick);
    })();
  });
}

let pendingBubble = null;

async function handle(out) {
  iv = out.interview_id; turn = out.turn;
  // 실시간 받아쓰기 말풍선을 서버가 알아들은 글로 바꾼다 (못 알아들었으면 지운다)
  if (pendingBubble) { if (out.transcript) { pendingBubble.textContent = out.transcript; pendingBubble.className = "me"; } else pendingBubble.remove(); pendingBubble = null; }
  else if (out.transcript) say("me", out.transcript);
  say("ai", out.say_ko);
  await speak(out.say_ko, (out.audio && (await out.audio)) || out.audio_url);
  if (out.done || stopped) return finish();
  loop();
}

async function send(form, filler = Promise.resolve()) {
  form.append("turn", turn);
  status("💭 생각하는 중…");
  // 답이 오면 맞장구가 끝나기를 기다리지 않고 바로 다음 질문 음성을 받기 시작한다 (말 사이 간격 줄이기)
  const request = fetch(`${API}/interviews/${iv}/turns`, { method: "POST", body: form }).then(async (r) => {
    const out = await r.json();
    if (r.ok && out.audio_url) out.audio = fetch(out.audio_url).then((a) => (a.ok ? a.blob() : null)).then((b) => (b ? URL.createObjectURL(b) : null)).catch(() => null);
    return { ok: r.ok, out };
  });
  let ok, out;
  try {
    [{ ok, out }] = await Promise.all([request, filler]);  // 맞장구가 끝나야 다음 말을 한다
  } catch (e) {  // 인터넷이 잠깐 끊겨도 통화가 멈추지 않게 다시 듣는다
    ok = false; out = { error: { message: "연결이 잠깐 끊겼어요. 다시 말씀해 주세요" } };
  }
  if (!ok) {
    if (pendingBubble) { pendingBubble.remove(); pendingBubble = null; }
    status(out.error?.message || "오류가 났어요. 다시 들을게요");
    if (!stopped && out.error?.code !== "INTERVIEW_DONE") setTimeout(loop, 1500);  // 통화가 멈추지 않게 다시 듣는다
    return;
  }
  await handle(out);
}

async function loop() {
  if (stopped || busy) return;
  busy = true;
  const heard = await listen();
  busy = false;
  if (stopped) { if (heard?.bubble) heard.bubble.remove(); return; }
  if (!heard) { status("말씀이 없으시네요. 다시 들을게요"); return loop(); }
  const form = new FormData(); form.append("audio", heard.blob, "answer");
  if (heard.text) form.append("text", heard.text);  // 서버 음성 인식이 실패하면 이 글을 쓴다
  pendingBubble = heard.bubble || null;
  await send(form, backchannel());
}

async function finish() {
  stopped = true; status("통화가 끝났어요");
  const d = await (await fetch(`${API}/interviews/${iv}`)).json();
  $("result").classList.remove("hidden");
  $("publishRow").classList.toggle("hidden", d.kind !== "register");
  $("videoRow").classList.toggle("hidden", d.kind !== "story");
  $("resultText").textContent = d.kind === "register"
    ? JSON.stringify({ draft: d.draft, needs_check: d.needs_check }, null, 2)
    : (d.script_ko ? `영상에 들어갈 사장님 말:\n${d.script_ko}` : "이야기를 정리하는 중이에요. 잠시 뒤 영상 만들기를 누르세요.");
}

$("start").onclick = async () => {
  // 첫 탭에서 마이크와 소리 재생을 허락받는다 (iOS 자동 재생 제한)
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
  } catch (e) {
    return status("마이크를 쓸 수 있게 허용해 주세요 (주소창 옆 자물쇠 → 마이크 허용)");
  }
  ctx = new AudioContext(); analyser = ctx.createAnalyser(); analyser.fftSize = 1024;
  // 목소리 대역만 남긴다 (웅웅거리는 저음 소음, 쇳소리 같은 고음 소음을 덜 듣게)
  const hp = ctx.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 300;
  const lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 3400;
  ctx.createMediaStreamSource(stream).connect(hp); hp.connect(lp); lp.connect(analyser);
  player.src = silentWav();
  player.play().catch(() => {});
  $("log").innerHTML = ""; $("result").classList.add("hidden"); $("videoOut").innerHTML = "";
  stopped = false;
  const body = { kind: $("kind").value };
  if ($("store").value) body.store_id = Number($("store").value);
  const r = await fetch(`${API}/interviews`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const out = await r.json();
  if (!r.ok) { stopped = true; return status(out.error?.message || "시작하지 못했어요"); }
  loadFillers(out.fillers);  // 첫 질문을 듣는 동안 받아 둔다
  await handle(out);
};

$("stop").onclick = async () => {
  if (!iv) return;
  stopped = true;
  const out = await (await fetch(`${API}/interviews/${iv}/finish`, { method: "POST" })).json();
  say("ai", out.say_ko); await speak(out.say_ko, out.audio_url); finish();
};

$("send").onclick = async () => {
  const text = $("text").value.trim(); if (!text || !iv) return;
  $("text").value = ""; const form = new FormData(); form.append("text", text);
  stopped = true;  // 듣던 녹음은 버린다
  while (busy) await new Promise((r) => setTimeout(r, 50));
  stopped = false; await send(form);
};

$("publish").onclick = async () => {
  const out = await (await fetch(`${API}/interviews/${iv}/publish`, { method: "POST" })).json();
  $("resultText").textContent += `\n\n올렸어요: store_id=${out.store_id} (이 번호로 이야기 인터뷰를 할 수 있어요)`;
  $("store").value = out.store_id;
};

$("video").onclick = async () => {
  const form = new FormData();
  for (const f of $("photos").files) form.append("photos", f);
  form.append("interview_id", iv);
  const storeId = $("store").value;
  const r = await fetch(`${API}/stores/${storeId}/videos`, { method: "POST", body: form });
  const job = await r.json();
  if (!r.ok) return ($("videoOut").textContent = job.error?.message || "실패");
  for (;;) {
    const s = await (await fetch(`${API}/videos/jobs/${job.job_id}`)).json();
    $("videoOut").textContent = `영상 만드는 중 ${s.progress}%`;
    if (s.status === "failed") return ($("videoOut").textContent = s.error);
    if (s.status === "done") {
      const v = await (await fetch(`/api/v1/videos/${s.video_id}?lang=ko`)).json();
      $("videoOut").innerHTML = `<video src="${v.video_url}" controls playsinline style="width:100%;border-radius:12px"></video>`;
      return;
    }
    await new Promise((res) => setTimeout(res, 2000));
  }
};
</script>
</body>
</html>
