<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hackathon Demo</title>
    <style>
      :root { color-scheme: light dark; --bg: #f6f7f9; --panel: #fff; --text: #1d2228; --muted: #6b7380; --accent: #2f6fde; --border: #dde1e6; }
      @media (prefers-color-scheme: dark) { :root { --bg: #15181c; --panel: #1e2227; --text: #e7eaee; --muted: #9aa3ad; --border: #333a42; } }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.6 system-ui, -apple-system, "Apple SD Gothic Neo", sans-serif; }
      main { max-width: 760px; margin: 0 auto; padding: 32px 16px; display: grid; gap: 16px; }
      section { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
      h1 { margin: 0 0 12px; font-size: 22px; }
      textarea { width: 100%; min-height: 120px; padding: 10px; border: 1px solid var(--border); border-radius: 8px; background: transparent; color: inherit; font: inherit; resize: vertical; }
      .row { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
      button { padding: 8px 16px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; font: inherit; cursor: pointer; }
      button:disabled { opacity: .5; cursor: default; }
      #mode { margin-left: auto; font-size: 13px; color: var(--muted); }
      pre { margin: 0; white-space: pre-wrap; word-break: break-word; font: inherit; min-height: 3em; }
    </style>
  </head>
  <body>
    <main>
      <section>
        <h1>Hackathon Demo</h1>
        <form id="form">
          <textarea id="question" placeholder="질문을 입력하세요"></textarea>
          <div class="row">
            <button type="submit" id="send">보내기</button>
            <span id="mode">ready</span>
          </div>
        </form>
      </section>
      <section><pre id="answer">프론트가 준비되기 전 API 확인·백업 시연용 페이지입니다.</pre></section>
    </main>
    <script>
      const form = document.querySelector("#form");
      const question = document.querySelector("#question");
      const answer = document.querySelector("#answer");
      const mode = document.querySelector("#mode");
      const send = document.querySelector("#send");

      // /api/chat/stream 의 SSE 를 읽어 글자가 생기는 대로 보여준다.
      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const text = question.value.trim();
        if (!text) return;
        send.disabled = true;
        answer.textContent = "";
        mode.textContent = "running";
        try {
          const res = await fetch("api/chat/stream", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ messages: [{ role: "user", content: text }] }),
          });
          if (!res.ok) throw new Error((await res.json()).detail || res.statusText);
          const reader = res.body.pipeThrough(new TextDecoderStream()).getReader();
          let buffer = "";
          for (;;) {
            const { value, done } = await reader.read();
            if (done) break;
            buffer += value;
            const events = buffer.split("\n\n");
            buffer = events.pop();
            for (const raw of events) {
              const type = (raw.match(/^event: (.*)$/m) || [, "message"])[1];
              const data = JSON.parse((raw.match(/^data: (.*)$/m) || [, "{}"])[1]);
              if (type === "message") answer.textContent += data.text;
              else if (type === "error") answer.textContent += `\n\n[error] ${data.detail}`;
              else if (type === "done") mode.textContent = data.mode;
            }
          }
        } catch (error) {
          answer.textContent = String(error.message || error);
          mode.textContent = "error";
        } finally {
          send.disabled = false;
        }
      });
    </script>
  </body>
</html>
